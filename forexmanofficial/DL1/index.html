<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forexman — Your Edge in the Forex Market</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', sans-serif;
    background: #080c12;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  canvas#grid {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    opacity: 0.4;
  }

  .glow-orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(120px);
    pointer-events: none;
    z-index: 0;
  }
  .orb-1 { width: 500px; height: 500px; background: rgba(10,191,188,0.15); top: -150px; right: -100px; }
  .orb-2 { width: 400px; height: 400px; background: rgba(0,229,204,0.08); bottom: -100px; left: -80px; }

  .card {
    position: relative;
    z-index: 10;
    background: rgba(13,20,32,0.85);
    border: 1px solid rgba(10,191,188,0.3);
    border-radius: 24px;
    padding: 48px 40px;
    max-width: 480px;
    width: calc(100% - 32px);
    text-align: center;
    box-shadow: 0 0 60px rgba(10,191,188,0.08), 0 0 0 1px rgba(10,191,188,0.05) inset;
    backdrop-filter: blur(20px);
    animation: cardIn 0.8s cubic-bezier(0.22,1,0.36,1) both;
  }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(30px) scale(0.97); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .corner {
    position: absolute;
    width: 20px; height: 20px;
    border-color: #0abfbc;
    border-style: solid;
  }
  .corner-tl { top: -1px; left: -1px; border-width: 2px 0 0 2px; border-radius: 4px 0 0 0; }
  .corner-tr { top: -1px; right: -1px; border-width: 2px 2px 0 0; border-radius: 0 4px 0 0; }
  .corner-bl { bottom: -1px; left: -1px; border-width: 0 0 2px 2px; border-radius: 0 0 0 4px; }
  .corner-br { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; border-radius: 0 0 4px 0; }

  .live-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(10,191,188,0.1);
    border: 1px solid rgba(10,191,188,0.3);
    border-radius: 20px;
    padding: 4px 14px;
    font-size: 11px;
    font-weight: 500;
    color: #0abfbc;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 24px;
  }
  .live-dot {
    width: 7px; height: 7px;
    background: #0abfbc;
    border-radius: 50%;
    animation: pulse 1.5s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.4;transform:scale(0.7)} }

  .logo-wrap {
    margin-bottom: 24px;
  }
  .logo-wrap img {
    width: 90px;
    height: 90px;
    object-fit: contain;
    border-radius: 16px;
    filter: drop-shadow(0 0 20px rgba(10,191,188,0.4));
  }

  h1 {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(1.4rem, 5vw, 1.85rem);
    font-weight: 900;
    color: #fff;
    line-height: 1.2;
    margin-bottom: 16px;
    letter-spacing: -0.01em;
  }
  h1 span { color: #0abfbc; }

  .desc {
    color: rgba(255,255,255,0.55);
    font-size: 0.92rem;
    line-height: 1.65;
    margin-bottom: 32px;
  }

  .stats-row {
    display: flex;
    justify-content: center;
    gap: 24px;
    margin-bottom: 32px;
    padding: 16px 0;
    border-top: 1px solid rgba(10,191,188,0.1);
    border-bottom: 1px solid rgba(10,191,188,0.1);
  }
  .stat { text-align: center; }
  .stat-num { font-family: 'Orbitron', sans-serif; font-size: 1.1rem; font-weight: 700; color: #0abfbc; }
  .stat-label { font-size: 0.72rem; color: rgba(255,255,255,0.4); margin-top: 2px; text-transform: uppercase; letter-spacing: 0.05em; }

  .cta-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 16px 28px;
    background: linear-gradient(135deg, #0abfbc, #00e5cc);
    border: none;
    border-radius: 12px;
    color: #080c12;
    font-family: 'Inter', sans-serif;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    text-decoration: none;
    transition: all 0.25s ease;
    box-shadow: 0 0 30px rgba(10,191,188,0.3);
    position: relative;
    overflow: hidden;
  }
  .cta-btn::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, transparent 40%, rgba(255,255,255,0.15));
    pointer-events: none;
  }
  .cta-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 0 50px rgba(10,191,188,0.5);
  }
  .cta-btn:active { transform: translateY(0); }
  .tg-icon { flex-shrink: 0; }

  .sub-text {
    margin-top: 16px;
    font-size: 0.78rem;
    color: rgba(255,255,255,0.3);
  }

  @media (max-width: 480px) {
    .card { padding: 36px 24px; }
    .stats-row { gap: 16px; }
  }
</style>
</head>

<script>
const canvas = document.getElementById('grid');
const ctx = canvas.getContext('2d');

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

const CELL = 40;
let t = 0;

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const cols = Math.ceil(canvas.width / CELL) + 1;
  const rows = Math.ceil(canvas.height / CELL) + 1;

  ctx.strokeStyle = 'rgba(10,191,188,0.15)';
  ctx.lineWidth = 0.5;

  for (let x = 0; x <= cols; x++) {
    ctx.beginPath();
    ctx.moveTo(x * CELL, 0);
    ctx.lineTo(x * CELL, canvas.height);
    ctx.stroke();
  }
  for (let y = 0; y <= rows; y++) {
    ctx.beginPath();
    ctx.moveTo(0, y * CELL);
    ctx.lineTo(canvas.width, y * CELL);
    ctx.stroke();
  }

  // Glowing intersection dots
  for (let x = 0; x <= cols; x++) {
    for (let y = 0; y <= rows; y++) {
      const wave = Math.sin(t * 0.02 + x * 0.4 + y * 0.3) * 0.5 + 0.5;
      if (wave > 0.85) {
        ctx.beginPath();
        ctx.arc(x * CELL, y * CELL, 2, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(10,191,188,${wave * 0.6})`;
        ctx.fill();
      }
    }
  }

  t++;
  requestAnimationFrame(draw);
}
draw();
</script>
